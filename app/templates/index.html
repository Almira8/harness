<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alylabb · Reels studio</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <aside>
    <a class="brand" href="/">alylabb<span>Reels studio</span></a>
    <nav><button class="nav active" data-view="projects">Выпуски</button><button class="nav" data-view="references">Референсы</button><button class="nav" data-view="jobs">Задачи</button><button class="nav" data-view="settings">Подключения</button></nav>
    <div class="aside-bottom">Instagram @alylabb</div>
  </aside>
  <main>
    <header><div><p class="eyebrow">Твоя редакция</p><h1 id="page-title">Выпуски</h1></div><button id="new-project" class="primary">Новый Reels <span>＋</span></button></header>
    <div id="notice" role="status" hidden></div>
    <section id="content" aria-live="polite"><p>Загружаем выпуски…</p></section>
  </main>
  <dialog id="create-dialog">
    <form id="create-form">
      <div class="section-heading"><h2>Новый выпуск</h2><button type="button" data-close aria-label="Закрыть">×</button></div>
      <label>Рабочее название<input name="title" required maxlength="200" placeholder="Например, ИИ монтирует мой Reels"></label>
      <label>Задание<textarea name="brief" required rows="4" placeholder="Какую мысль раскрываем и что покажем зрителю?"></textarea></label>
      <label>Вопросы аудитории<textarea name="questions" rows="3" placeholder="Вставь вопросы в исходных формулировках"></textarea></label>
      <button class="primary" type="submit">Создать выпуск</button>
    </form>
  </dialog>
</body>
</html>
