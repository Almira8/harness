services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://harness:local-harness@db:5432/harness
      DATA_DIR: /data
      MEDIA_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
      - ./assets/backgrounds:/app/assets/backgrounds:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://harness:local-harness@db:5432/harness
      DATA_DIR: /data
      MEDIA_BASE_URL: http://api:8000
    volumes:
      - ./data:/data
      - ./workspace:/app/workspace
      - ./assets/backgrounds:/app/assets/backgrounds:ro
      - ./remotion-studio/src:/app/remotion-studio/src:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: local-harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness -d harness"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
